name: Engine CI

# The engine (:core and :player-core, in /engine) is checked on its own, on top of the app build:
#   - the unit tests of both modules
#   - lint, with abortOnError = true in each module's build file
#   - the Room schema JSONs, which must not change unless a migration was intended
#
# Instrumentation tests are compiled, never run: there is no device here, and running them on a real
# TV wipes its data.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: App name applied everywhere (tools/brand/brand.json)
        run: python3 engine/tools/brand/apply_name.py check

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'   # matches gradle/gradle-daemon-jvm.properties (toolchainVersion=21)

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 'tools' is obsolete and Google removed it from the SDK repository; the
          # action still asks for it by default, which fails the whole setup step.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew -p engine :core:testDebugUnitTest :player-core:testDebugUnitTest --stacktrace

      - name: Lint
        if: always()   # report both verdicts in one run instead of one failure at a time
        run: ./gradlew -p engine :core:lintDebug :player-core:lintDebug --stacktrace

      # Compiles the instrumentation APKs so a broken androidTest source set fails here rather than
      # silently rotting, unnoticed until someone next runs it.
      - name: Compile instrumentation tests
        if: always()
        run: ./gradlew -p engine :core:assembleDebugAndroidTest :player-core:assembleDebugAndroidTest

      # The single most valuable check in this repo. KSP regenerates the schema for the current
      # @Database on every build; if that output differs from what is committed, the entities changed
      # without a migration and both apps would fail to open an existing database.
      - name: Room schemas unchanged
        if: always()
        run: |
          if ! git diff --exit-code -- engine/core/schemas; then
            echo "::error::A Room schema JSON changed. If this was intentional, bump the database"
            echo "::error::version and add a migration; then commit the regenerated schema."
            exit 1
          fi

      - name: Upload test and lint reports
        if: always()   # the reports matter most when a step above failed
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            engine/core/build/reports/tests/**
            engine/core/build/reports/lint-results-*.html
            engine/player-core/build/reports/tests/**
            engine/player-core/build/reports/lint-results-*.html
          if-no-files-found: warn
